<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>طلب التطوع - الجمعية الخيرية لرعاية اليتيم</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo-area">
                <div class="logo-icon">🤲</div>
                <div class="logo-text">
                    <h2>جمعية رعاية اليتيم</h2>
                    <span>العطاوية - تأسست 2012</span>
                </div>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">الرئيسية</a></li>
                    <li><a href="about.html">من نحن</a></li>
                    <li><a href="activities.html">الأنشطة</a></li>
                    <li><a href="benefit.html">طلب الاستفادة</a></li>
                    <li><a href="sponsorship.html" class="nav-cta">كفالة مباشرة</a></li>
                    <li><a href="volunteer.html" class="active">التطوع</a></li>
                    <li><a href="contact.html">تواصل معنا</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="page-header">
        <h1>انضم إلى فريق المتطوعين</h1>
        <p>بصمتك وتوقيتك يصنعان الفارق الكبير في إنجاح أعمالنا الاجتماعية</p>
    </div>

    <div class="wrapper">
        <div class="card-box">
            <form action="#" method="POST">
                <div class="form-grid">
                    <div class="form-group">
                        <label>الاسم الكامل:</label>
                        <input type="text" required placeholder="اسم المتطوع">
                    </div>
                    <div class="form-group">
                        <label>رقم الهاتف:</label>
                        <input type="tel" required placeholder="06xxxxxxxx">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>المستوى الدراسي أو المهنة:</label>
                        <input type="text" placeholder="مثال: أستاذ، طالب، تقني...">
                    </div>
                    <div class="form-group">
                        <label>مجال التطوع المفضل:</label>
                        <select>
                            <option>التنظيم اللوجستيكي للقفات والمساعدات</option>
                            <option>الدعم التربوي وتدريس الأيتام</option>
                            <option>التواصل والتصوير وصناعة المحتوى</option>
                            <option>البحث الاجتماعي ومتابعة الحالات</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">تسجيل كمتطوع جديد</button>
            </form>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © الجمعية الخيرية لرعاية اليتيم بالعطاوية 2026</p>
    </footer>

</body>
</html>
