<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>طلب التطوع</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>...</header>

    <div class="container">
        <h1>انضم إلى فريق المتطوعين</h1>
        <p>بصمتك تصنع الفارق. انضم إلينا للمساهمة في تأطير وتنظيم أنشطة الجمعية:</p>
        
        <form action="#" method="POST" style="margin-top: 20px;">
            <div class="form-group">
                <label>الاسم الكامل:</label>
                <input type="text" required>
            </div>
            <div class="form-group">
                <label>رقم الهاتف:</label>
                <input type="tel" required>
            </div>
            <div class="form-group">
                <label>المستوى الدراسي / المهنة:</label>
                <input type="text">
            </div>
            <div class="form-group">
                <label>المجال الذي تفضل المساهمة فيه:</label>
                <select>
                    <option>التنظيم اللوجستيكي للقفات والمساعدات</option>
                    <option>الدعم التربوي وتدريس الأيتام</option>
                    <option>التواصل والتصوير وإعداد المحتوى الرقمي</option>
                    <option>البحث الاجتماعي ومتابعة الحالات</option>
                </select>
            </div>
            <button type="submit" class="btn">سجل كمتطوع</button>
        </form>
    </div>

    <footer>...</footer>
</body>
</html>
