<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>كفالة مباشرة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>...</header>

    <div class="container">
        <h1>طلب كفالة مباشرة ليتيم</h1>
        <p>كن سبباً في رسم الابتسامة واكفل يتيماً. يرجى ملء الاستمارة وسنتواصل معك للتنسيق:</p>
        
        <form action="#" method="POST" style="margin-top: 20px;">
            <div class="form-group">
                <label>اسم المتبرع / الكافل:</label>
                <input type="text" required>
            </div>
            <div class="form-group">
                <label>رقم الهاتف أو الواتساب:</label>
                <input type="tel" required>
            </div>
            <div class="form-group">
                <label>نوع الكفالة المرغوبة:</label>
                <select>
                    <option>كفالة مادية شهرياً</option>
                    <option>كفالة تعليمية (أدوات مدرسية)</option>
                    <option>كفالة سنوية (مناسبات رمضان والعيد)</option>
                </select>
            </div>
            <div class="form-group">
                <label>ملاحظات إضافية:</label>
                <textarea rows="3"></textarea>
            </div>
            <button type="submit" class="btn">تأكيد طلب الكفالة</button>
        </form>
    </div>

    <footer>...</footer>
</body>
</html>
