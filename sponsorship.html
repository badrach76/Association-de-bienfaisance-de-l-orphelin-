<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كفالة مباشرة - الجمعية الخيرية لرعاية اليتيم</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo-area">
                <div class="logo-icon">🤲</div>
                <div class="logo-text">
                    <h2>جمعية رعاية اليتيم</h2>
                    <span>العطاوية - تأسست 2012</span>
                </div>
            </div>
            
            <button class="menu-toggle" id="menuToggle" aria-label="فتح القائمة">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav id="navMenu">
                <ul>
                    <li><a href="index.html">الرئيسية</a></li>
                    <li><a href="about.html">من نحن</a></li>
                    <li><a href="activities.html">الأنشطة</a></li>
                    <li><a href="benefit.html">طلب الاستفادة</a></li>
                    <li><a href="sponsorship.html" class="nav-cta active">كفالة مباشرة</a></li>
                    <li><a href="volunteer.html">التطوع</a></li>
                    <li><a href="contact.html">تواصل معنا</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="page-header" style="background: linear-gradient(135deg, var(--accent), var(--accent-hover));">
        <h1>كفالة يتيم مباشرة</h1>
        <p>كن سنداً ورفيقاً ليتيم، واجعل لخيرك أثراً ممتداً وثابتاً</p>
    </div>

    <div class="wrapper">
        <div class="card-box">
            <form action="#" method="POST">
                <div class="form-grid">
                    <div class="form-group">
                        <label>اسم الكافل / المحسن الكريم:</label>
                        <input type="text" required placeholder="الاسم الكامل أو اسم المؤسسة">
                    </div>
                    <div class="form-group">
                        <label>رقم الهاتف أو الواتساب للتواصل:</label>
                        <input type="tel" required placeholder="06xxxxxxxx">
                    </div>
                </div>

                <div class="form-group">
                    <label>نوع الكفالة المرغوبة:</label>
                    <select>
                        <option>كفالة مادية شهرية منتظمة</option>
                        <option>كفالة تعليمية (تغطية الأدوات واللوازم)</option>
                        <option>كفالة موسمية (رمضان والعيدين)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>ملاحظات إضافية أو استفسارات:</label>
                    <textarea rows="3" placeholder="أضف أي تفاصيل ترغب في توضيحها لتنسيق الكفالة"></textarea>
                </div>

                <button type="submit" class="btn-primary" style="background: var(--accent);">تأكيد طلب الكفالة والتواصل معك</button>
            </form>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © الجمعية الخيرية لرعاية اليتيم بالعطاوية 2026</p>
    </footer>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navMenu = document.getElementById('navMenu');
        menuToggle.addEventListener('click', () => { navMenu.classList.toggle('active'); });
        document.querySelectorAll('nav ul li a').forEach(link => {
            link.addEventListener('click', () => { navMenu.classList.remove('active'); });
        });
    </script>
</body>
</html>
